<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひまちゃんねる</title>
<meta name="description" content="登録不要・匿名で自由に書き込める雑談掲示板「ひまちゃんねる」。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a class="site-title" href="index.html">ひま<span>ちゃんねる</span></a>
    <p class="site-tagline">登録不要・匿名で自由に書き込める雑談掲示板</p>
  </header>
  <div class="ad-slot">
    <span class="ad-slot-label">広告</span>
    <script>
      atOptions = { 'key' : 'fdf07d3f2ce2d84d45e91ab91560509a', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
    </script>
    <script src="https://www.highrevenueformat.com/fdf07d3f2ce2d84d45e91ab91560509a/invoke.js"></script>
  </div>
  <main>
    <div id="boards" class="board-grid">
      <p class="empty-state">読み込み中...</p>
    </div>
  </main>
  <footer class="site-footer">
    <p><a href="terms.html">利用規約・削除依頼について</a></p>
    <p>&copy; 2026 ひまちゃんねる</p>
  </footer>
</div>
<script src="api.js"></script>
<script>
(async function () {
  const el = document.getElementById("boards");
  try {
    const { boards } = await apiGet("/api/boards");

    const latests = await Promise.all(
      boards.map((b) =>
        apiGet(`/api/boards/${encodeURIComponent(b.slug)}/threads`)
          .then((res) => (res.threads && res.threads[0]) || null)
          .catch(() => null)
      )
    );

    el.innerHTML = boards
      .map((b, i) => {
        const latest = latests[i];
        const latestHtml = latest
          ? `<p class="board-card-latest">最新: ${latest.title}</p>`
          : `<p class="board-card-latest board-card-latest-empty">まだスレッドがありません</p>`;
        return `<a class="board-card" href="board.html?b=${encodeURIComponent(b.slug)}">
          <p class="board-card-name">${b.name}</p>
          <p class="board-card-desc">${b.description}</p>
          ${latestHtml}
        </a>`;
      })
      .join("");
  } catch (e) {
    el.innerHTML = `<p class="empty-state">読み込みに失敗しました。時間をおいて再度お試しください。</p>`;
  }
})();
</script>
</body>
</html>
