<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひまちゃんねる</title>
<meta name="description" content="登録不要・匿名で自由に書き込める雑談掲示板「ひまちゃんねる」。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a class="site-title" href="index.html">ひま<span>ちゃんねる</span></a>
    <p class="site-tagline">登録不要・匿名で自由に書き込める雑談掲示板</p>
  </header>
  <div class="ad-slot">
    <span class="ad-slot-label">広告</span>
    <script>
      atOptions = { 'key' : 'fdf07d3f2ce2d84d45e91ab91560509a', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
    </script>
    <script src="https://www.highrevenueformat.com/fdf07d3f2ce2d84d45e91ab91560509a/invoke.js"></script>
  </div>
  <main>
    <div id="boards" class="board-grid">
      <p class="empty-state">読み込み中...</p>
    </div>

    <h2 class="section-title">最新スレッド</h2>
    <ul id="recent-threads" class="thread-list">
      <li><a href="#">読み込み中...</a></li>
    </ul>
  </main>
  <footer class="site-footer">
    <p><a href="terms.html">利用規約・削除依頼について</a></p>
    <p>&copy; 2026 ひまちゃんねる</p>
  </footer>
</div>
<script src="api.js"></script>
<script>
(async function () {
  const el = document.getElementById("boards");
  try {
    const { boards } = await apiGet("/api/boards");
    el.innerHTML = boards
      .map(
        (b) => `<a class="board-card" href="board.html?b=${encodeURIComponent(b.slug)}">
          <p class="board-card-name">${b.name}</p>
          <p class="board-card-desc">${b.description}</p>
        </a>`
      )
      .join("");
  } catch (e) {
    el.innerHTML = `<p class="empty-state">読み込みに失敗しました。時間をおいて再度お試しください。</p>`;
  }
})();

(async function () {
  const el = document.getElementById("recent-threads");
  try {
    const { threads } = await apiGet("/api/threads/recent?limit=10");
    if (threads.length === 0) {
      el.innerHTML = `<li><p class="empty-state" style="padding:14px">まだスレッドがありません。</p></li>`;
      return;
    }
    el.innerHTML = threads
      .map(
        (t) => `<li><a href="thread.html?id=${t.id}">
          <span class="thread-title">${t.title}</span>
          <span class="thread-meta">${t.board ? t.board.name : ""} ・ ${t.post_count}レス ・ ${fmtDate(t.last_reply_at)}</span>
        </a></li>`
      )
      .join("");
  } catch (e) {
    el.innerHTML = `<li><p class="empty-state" style="padding:14px">読み込みに失敗しました。</p></li>`;
  }
})();
</script>
</body>
</html>
